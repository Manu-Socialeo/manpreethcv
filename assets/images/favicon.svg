<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="m-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B0F19; stroke: #1F2937; }
      .letter { fill: #F9FAFB; }
      .dot { fill: #38BDF8; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #FFFFFF; stroke: #E5E7EB; }
      .letter { fill: #0F172A; }
      .dot { fill: #2563EB; }
    }
  </style>

  <!-- Squircle rounded base -->
  <rect class="bg" x="4" y="4" width="56" height="56" rx="16" stroke-width="2" filter="url(#glow)"/>

  <!-- Stylized Geometric "M" -->
  <path class="letter" d="M18 44V20h5.2l8.8 13.8L40.8 20H46v24h-5.2V28.4L32.7 41.2h-1.4L23.2 28.4V44H18z"/>

  <!-- Electric Dot Accent -->
  <circle class="dot" cx="47" cy="43" r="3.2"/>
</svg>
